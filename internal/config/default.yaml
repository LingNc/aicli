# ──── aicli 默认配置 ────
config_version: "1.1"
api_key: ""
base_url: "https://api.openai.com"
model: "gpt-4o"
mode: "ai"           # ai | rules | permissive 优先

# ──── 用户白名单（ai 模式直接执行）────
whitelist: []

# ──── 禁止执行的命令（永远拒绝）────
forbidden_patterns:
  - "rm -rf /"
  - "dd if=/dev/zero of=/dev/"
  - "dd if=/dev/urandom of=/dev/"
  - ":(){ :|:& };:"
  - "mkfs"
  - "fdisk"
  - "chmod -R 777 /"
  - "chown -R /"

# ──── 需要确认的危险命令 ────
dangerous_patterns:
  - "rm -rf"
  - "dd if="
  - "chmod -R"
  - "chown -R"

# ──── 请求体参数（直接合并到 API 请求 JSON）────
# temperature / max_tokens 为标准参数
# 关闭思考模式参数按提供商需求添加，例如：
#   thinking: {"type": "disabled"}         # Anthropic/OpenAI 风格
#   enable_thinking: false                 # 某些提供商
#   extra_body: {"thinking": {"type": "disabled"}}
#   extra_body: {"thinking": false}
request_body:
  temperature: 0.1
  max_tokens: 4096

  extra_body: {
    "thinking": { "type": "disabled" }
  }

# ──── 思考模式请求体（--think/-t 时合并到请求体，覆盖 request_body 中同名字段）────
# 不同提供商的配置不同
thinking_body:
  extra_body: {
    "thinking": { "type": "enabled" }
  }

# ──── 思考显示配置 ────
# 思考占据的最大行数
thinking_lines: 3
# 0 标识默认终端显示的宽度
thinking_line_len: 0

# ──── 超时配置（秒）────
api_timeout: 300        # 首字节超时（发请求到收到第一个 chunk，排队场景需要较长时间）
exec_timeout: 30        # 命令执行超时
stream_timeout: 30      # 流式 chunk 间超时（两个 chunk 之间的最大间隔）
