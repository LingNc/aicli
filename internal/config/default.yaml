# ──── aicli 默认配置 ────
config_version: 1
api_key: ""
base_url: "https://api.openai.com"
model: "gpt-4o"
mode: "ai"           # ai | rules | permissive
debug: false
debug_log_console: false
debug_log_dir: ""

# ──── 用户白名单（ai 模式直接执行）────
whitelist: []

# ──── 禁止执行的命令（永远拒绝）────
forbidden_patterns:
  - "rm -rf /"
  - "dd if=/dev/zero of=/dev/"
  - "dd if=/dev/urandom of=/dev/"
  - ":(){ :|:& };:"
  - "mkfs"
  - "fdisk"
  - "chmod -R 777 /"
  - "chown -R /"

# ──── 需要确认的危险命令 ────
dangerous_patterns:
  - "rm -rf"
  - "dd if="
  - "chmod -R"
  - "chown -R"

# ──── 请求体参数（直接合并到 API 请求 JSON）────
# temperature / max_tokens 为标准参数
# 其他参数按提供商需求添加，例如：
#   enable_thinking: false                 # 某些提供商
#   thinking: {"type": "disabled"}         # Anthropic 风格
#   extra_body: {"enable_thinking": false} # DeepSeek
#   extra_body: {"thinking": {"type": "disabled"}}
#   extra_body: {"thinking": false}
request_body:
  temperature: 0.1
  max_tokens: 1024

  extra_body: {
    "enable_thinking": false
  }
