# ──── ai 默认配置 ────
api_key: ""
base_url: "https://api.openai.com"
model: "gpt-4o"
mode: "ai"           # ai | rules | permissive
debug: false
debug_log_console: false
debug_log_dir: ""

# ──── 用户白名单（ai 模式直接执行）────
whitelist: []

# ──── 禁止执行的命令（永远拒绝）────
forbidden_patterns:
  - "rm -rf /"
  - "dd if=/dev/zero of=/dev/"
  - "dd if=/dev/urandom of=/dev/"
  - ":(){ :|:& };:"
  - "mkfs"
  - "fdisk"
  - "chmod -R 777 /"
  - "chown -R /"

# ──── 需要确认的危险命令 ────
dangerous_patterns:
  - "rm -rf"
  - "dd if="
  - "chmod -R"
  - "chown -R"

# ──── 额外请求体参数（直接合并到 API 请求 JSON）────
# 不同提供商关闭/开启思考模式的方式不同，按需配置：
#   OpenAI 兼容: extra_body: {"thinking": {"type": "disabled"}}
#   部分模型:    extra_body: {"enable_thinking": false}
#   部分模型:    extra_body: {"thinking": false}
# 默认为空，不注入任何额外参数
extra_body: {}
